# Registers Varify's extension (via ServiceLoader) for all tests, so test methods with a VarifyContext parameter (or
# context parameter) don't need @ExtendWith or @Varify.
junit.jupiter.extensions.autodetection.enabled=true

# The include pattern ignores extensions that other libraries might register.
junit.jupiter.extensions.autodetection.include=varify.junit.VarifyExtension
